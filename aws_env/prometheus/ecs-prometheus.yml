global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'web-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['127.0.0.1:5000']

  - job_name: 'web-app'
    metrics_path: '/errors'
    static_configs:
      - targets: ['127.0.0.1:5000']
      
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'python-app'
    static_configs:
      - targets: ['localhost:5000']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
