global:
  scrape_interval: 5s # Frequent updates for demo purposes

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'python-app'
    static_configs:
      - targets: ['web-app:5000']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']